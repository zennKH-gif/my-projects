<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me - Day 3</title>
</head>
<body>
    <header>
        <h1>Get in Touch</h1>
        <p>Have a Question or the to Work Together? send me a message below!</p>
    </header>
    <main>
        <form>
            <div>
                <label for="name">Name:</label><br>
                <input type="text" id="name" placeholder="Type your name here" required>
            </div>
            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" placeholder="name@gmail.com" required>
            </div>
            <div>
                <label for="message">Message:</label><br>
                <textarea id="message" placeholder="Type your message here..." required></textarea>
            </div>
            <div>
                <button type="submit">Send Message</button>
            </div>
        </form>
        <section>
            <h2>My Journey Stats</h2>
            <table border="1">
                <tr>
                    <th>Day</th>
                    <th>Topic</th>
                    <th>status</th>
                </tr>
                <tr>
                    <td>Day 1</td>
                    <td>About Me</td>
                    <td>Done</td>
                </tr>
                <tr>
                    <td>Day 2</td>
                    <td>Movies & Games</td>
                    <td>Done</td>
                </tr>
            </table>
        </section>
    </main>
</body>
</html>
